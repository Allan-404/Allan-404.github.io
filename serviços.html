<!DOCTYPE html>
    <html>
        <header>
            <title>Serviços</title>
            <link href="style.css" rel="stylesheet" type="text/css" />
        </header>
            <body>
                <center>
    
                    <h1>Serviços</h1>
            <script>
                let produtos = [
                    { nome: "Produto 1", preco: 10.99 },
                    ];
                function mostrarProdutos() { 
                    listaProdutos.innerHTML = "";
                    const listaProdutos = document.getElementById("lista-produtos");
                    produtos.forEach(produto => {
                        const item = document.createElement("li");
                        item.textContent = `${produto.nome} - R$ ${produto.preco.toFixed(2)}`;
                        listaProdutos.appendChild(item);
                    });
                }
                function adicionarProduto(produto,preco) {
                    const nomeInput = document.getElementById("nome");
                    const precoInput = document.getElementById("preco");
                    const novoProduto = {nome:nome preco:preco};
                    produtos.push(novoProduto);
                    nomeInput.value = "";
                    precoInput.value = "";
                }
            </script>
            <form onsubmit="event.preventDefault(); adicionarProduto(); limparCadastro()">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome">
                <label for="preco">Preço:</label>
                <input type="number" id="preco" name="preco" step="0.01">
                <br/>
                <button type="submit">Adicionar Produto</button>
            </form>
            <button onclick="mostrarProdutos() ">Mostrar Produtos</button>
            <h2>Produtos</h2>
            <ul id="lista-produtos">
            </ul>

                </center>
                <br/>
                <button onclick="window.location.href='index.html'">Voltar</button>

            </body>
    </html>
